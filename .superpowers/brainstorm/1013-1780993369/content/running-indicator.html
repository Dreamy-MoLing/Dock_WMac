<h2>运行状态指示器 — 方案对比</h2>
<p class="subtitle">当前：亮黄绿实心圆点（直径 6px）。选择你偏好的替代方案。</p>

<div class="cards" data-multiselect>
  <div class="card" data-choice="a" onclick="toggleSelect(this)">
    <div class="card-image" style="background:#1e1e1e;display:flex;align-items:center;justify-content:center;min-height:120px">
      <div style="position:relative;width:48px;height:48px;background:#3a3a3a;border-radius:12px">
        <div style="position:absolute;bottom:1px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:#64c855;box-shadow:0 0 4px rgba(100,200,85,0.6)"></div>
      </div>
    </div>
    <div class="card-body">
      <h3>A — 小绿光点</h3>
      <p>直径 5px，柔和绿色 (#64c855)，带微弱光晕。最小最不显眼。</p>
    </div>
  </div>

  <div class="card" data-choice="b" onclick="toggleSelect(this)">
    <div class="card-image" style="background:#1e1e1e;display:flex;align-items:center;justify-content:center;min-height:120px">
      <div style="position:relative;width:48px;height:48px;background:#3a3a3a;border-radius:12px">
        <div style="position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:8px;height:3px;border-radius:2px;background:#80c860"></div>
      </div>
    </div>
    <div class="card-body">
      <h3>B — 小横条</h3>
      <p>底部细横条 (8×3px)，类似 macOS Dock 风格。不发光，纯色。</p>
    </div>
  </div>

  <div class="card" data-choice="c" onclick="toggleSelect(this)">
    <div class="card-image" style="background:#1e1e1e;display:flex;align-items:center;justify-content:center;min-height:120px">
      <div style="position:relative;width:48px;height:48px;background:#3a3a3a;border-radius:12px">
        <div style="position:absolute;bottom:1px;left:50%;transform:translateX(-50%);width:7px;height:7px;border-radius:50%;background:rgba(120,200,100,0.35)"></div>
        <div style="position:absolute;bottom:2.5px;left:50%;transform:translateX(-50%);width:3.5px;height:3.5px;border-radius:50%;background:#80d870"></div>
      </div>
    </div>
    <div class="card-body">
      <h3>C — 光晕小点</h3>
      <p>内实心 3.5px + 外半透明光晕 7px。两层叠加，柔和但有层次。</p>
    </div>
  </div>

  <div class="card" data-choice="d" onclick="toggleSelect(this)">
    <div class="card-image" style="background:#1e1e1e;display:flex;align-items:center;justify-content:center;min-height:120px">
      <div style="position:relative;width:48px;height:48px;background:#3a3a3a;border-radius:12px;">
        <svg width="48" height="48" style="position:absolute;top:0;left:0">
          <circle cx="24" cy="44" r="2.5" fill="#70c860" opacity="0.9"/>
        </svg>
      </div>
    </div>
    <div class="card-body">
      <h3>D — 极简小点</h3>
      <p>半径 2.5px 纯绿点，无光晕无动画附加。极简主义风格。</p>
    </div>
  </div>
</div>
