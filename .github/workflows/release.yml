name: Build & Release

on:
  push:
    branches: [master, rewrite]
    tags: ["v*"]
  pull_request:
    branches: [master, rewrite]

env:
  CONFIGURATION: Release
  PLATFORM: x64
  PLATFORM_TOOLSET: v145
  ARTIFACT_NAME: dock_wmac-windows-x64

permissions:
  contents: write

jobs:
  build:
    name: Windows (MSVC)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
          vs-prerelease: true

      - name: Resolve MSBuild path
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msbuild = (Get-Command msbuild.exe).Source
          if (-not $msbuild -or -not (Test-Path -LiteralPath $msbuild)) {
            throw "MSBuild not found"
          }
          "MSBUILD_PATH=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $msbuild -version

      - name: Build solution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:MSBUILD_PATH Dock_WMac_v2.sln /restore `
            "/p:Configuration=$env:CONFIGURATION" `
            "/p:Platform=$env:PLATFORM" `
            "/p:PlatformToolset=$env:PLATFORM_TOOLSET"

      - name: Run self-check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD "build\v2\$env:PLATFORM\$env:CONFIGURATION\Dock_WMac_v2.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Built executable not found: $exe"
          }
          & $exe --self-check

      - name: Package app folder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\scripts\package-v1-release.ps1 `
            -Configuration $env:CONFIGURATION `
            -Platform $env:PLATFORM `
            -PlatformToolset $env:PLATFORM_TOOLSET `
            -MSBuildPath $env:MSBUILD_PATH

      - name: Compress release artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { $shortSha }
          $zipName = "Dock_WMac-$version-windows-x64.zip"
          $zipPath = Join-Path (Join-Path $PWD "artifacts\release") $zipName
          if (Test-Path -LiteralPath $zipPath) {
            Remove-Item -LiteralPath $zipPath -Force
          }
          Compress-Archive -Path "artifacts\release\Dock_WMac\*" -DestinationPath $zipPath -Force
          "RELEASE_ZIP=$zipPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.RELEASE_ZIP }}
          if-no-files-found: error

      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.RELEASE_ZIP }}
          fail_on_unmatched_files: true
          overwrite_files: true
