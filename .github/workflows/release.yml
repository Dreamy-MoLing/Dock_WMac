name: Build & Release

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

env:
  BUILD_TYPE: Release
  QT_VERSION: '6.8.3'

jobs:
  build:
    name: Windows (MSVC)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64

      - name: Install Task
        uses: arduino/setup-task@v2

      - name: Set MSVC path & generator
        shell: bash
        run: |
          VS_PATH=$(vswhere -latest -property installationPath)
          VS_VER=$(vswhere -latest -property installationVersion)
          VS_MAJOR=$(echo "$VS_VER" | cut -d. -f1)
          case "$VS_MAJOR" in
            17) VS_YEAR=2022 ;;
            18) VS_YEAR=2026 ;;
            *)  echo "未知 VS major: $VS_MAJOR"; exit 1 ;;
          esac
          echo "VS_INSTALL_PATH=$VS_PATH" >> "$GITHUB_ENV"
          echo "CMAKE_GENERATOR=Visual Studio ${VS_MAJOR} ${VS_YEAR}" >> "$GITHUB_ENV"

      - name: Verify build environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Command cmake | Out-Null
          Get-Command task | Out-Null
          if (-not $env:QT_ROOT_DIR -or -not (Test-Path -LiteralPath $env:QT_ROOT_DIR)) {
            throw "QT_ROOT_DIR is missing or invalid: '$env:QT_ROOT_DIR'"
          }
          if (-not $env:VS_INSTALL_PATH -or -not (Test-Path -LiteralPath $env:VS_INSTALL_PATH)) {
            throw "VS_INSTALL_PATH is missing or invalid: '$env:VS_INSTALL_PATH'"
          }
          if (-not $env:CMAKE_GENERATOR) {
            throw 'CMAKE_GENERATOR is missing'
          }
          & (Join-Path $env:QT_ROOT_DIR 'bin/qmake.exe') -query QT_VERSION

      - name: Build, test, and package
        run: task ci

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dock_wmac-windows
          path: build/Dock_WMac_*.zip
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: windows-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: dock_wmac-windows
          path: .

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            Dock_WMac_*.zip
            LICENSE
          generate_release_notes: true
