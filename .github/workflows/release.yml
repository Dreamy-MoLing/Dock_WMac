name: Build & Release

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

env:
  BUILD_TYPE: Release

jobs:
  # ---- Windows build (PR + push) ----
  build:
    name: Windows (MSVC)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          arch: win64_msvc2022_64

      - name: Configure CMake
        shell: bash
        run: |
          VS_PATH=$(vswhere -latest -property installationPath)
          cmake --preset default -DBUILD_TESTS=ON \
            -DCMAKE_GENERATOR_INSTANCE="$VS_PATH" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Test
        run: cd build && ctest -C ${{ env.BUILD_TYPE }} --output-on-failure

      - name: Deploy Qt runtime dependencies
        shell: bash
        run: |
          windeployqt --no-translations --no-opengl-sw --compiler-runtime --dir deploy build/Mac任务栏.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dock_wmac-windows
          path: deploy
          if-no-files-found: error

  # ---- Release (tag only) ----
  release:
    name: Create Release
    runs-on: windows-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: dock_wmac-windows
          path: deploy

      - name: Extract tag name
        id: tag
        shell: bash
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Package release archive
        run: |
          Compress-Archive -Path deploy\* -DestinationPath dock_wmac_${{ steps.tag.outputs.tag }}_x64.zip

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          files: |
            dock_wmac_${{ steps.tag.outputs.tag }}_x64.zip
            LICENSE
          generate_release_notes: true
