name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  BUILD_TYPE: Release

jobs:
  # ---- Linux build (PR + push) ----
  linux:
    name: Linux (Ubuntu)
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 + build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev libqt6svg6-dev \
            cmake g++ make
          sudo apt-get clean

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dock_wmac-linux
          path: build/dock_wmac
          if-no-files-found: error

  # ---- Windows cross-compilation (tag only) ----
  windows:
    name: Windows (vcpkg cross-compile)
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build vcpkg Docker image (with cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: dock-wmac-vcpkg:ci
          cache-from: type=gha,scope=vcpkg
          cache-to: type=gha,scope=vcpkg,mode=max
          # Reduce image size by not keeping intermediate build artifacts
          provenance: false

      - name: Cross-compile dock_wmac.exe
        run: |
          docker run --rm -v ${{ github.workspace }}:/src dock-wmac-vcpkg:ci \
            sh -c "cmake --preset windows-cross -S /src && cmake --build --preset windows-cross"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dock_wmac-windows
          path: build_mxe/dock_wmac.exe
          if-no-files-found: error

      - name: Extract tag name
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          files: |
            build_mxe/dock_wmac.exe
            LICENSE
          generate_release_notes: true
