name: Build & Release

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

env:
  BUILD_TYPE: Release

jobs:
  # ---- Windows build (PR + push) ----
  build:
    name: Windows (MSVC)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          arch: win64_msvc2022_64

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: cmake --preset default -DCMAKE_PREFIX_PATH=${{ env.Qt6_DIR }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Deploy Qt runtime dependencies
        run: |
          windeployqt --no-translations --no-opengl-sw --compiler-runtime --dir deploy build/Mac任务栏.exe

      - name: Copy uninstall.exe to deploy
        shell: bash
        run: cp build/uninstall.exe deploy/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dock_wmac-windows
          path: deploy
          if-no-files-found: error

  # ---- Release (tag only) ----
  release:
    name: Create Release
    runs-on: windows-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dock_wmac-windows
          path: deploy

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: iscc installer/setup.iss

      - name: Extract tag name
        id: tag
        shell: bash
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Package release archive
        run: |
          Compress-Archive -Path deploy\* -DestinationPath dock_wmac_v${{ steps.tag.outputs.tag }}_x64.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          files: |
            dock_wmac_v${{ steps.tag.outputs.tag }}_x64.zip
            dist/Dock_WMac_Setup_v${{ steps.tag.outputs.tag }}.exe
            LICENSE
          generate_release_notes: true
