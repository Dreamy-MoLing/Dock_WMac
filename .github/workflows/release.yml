name: Build & Release

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: Windows (MSVC)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          arch: win64_msvc2022_64

      - name: Install Task
        uses: arduino/setup-task@v2

      - name: Set MSVC path & generator
        shell: bash
        run: |
          VS_PATH=$(vswhere -latest -property installationPath)
          VS_VER=$(vswhere -latest -property installationVersion)
          VS_MAJOR=$(echo "$VS_VER" | cut -d. -f1)
          case "$VS_MAJOR" in
            17) VS_YEAR=2022 ;;
            18) VS_YEAR=2026 ;;
            *)  echo "未知 VS major: $VS_MAJOR"; exit 1 ;;
          esac
          echo "VS_INSTALL_PATH=$VS_PATH" >> "$GITHUB_ENV"
          echo "CMAKE_GENERATOR=Visual Studio ${VS_MAJOR} ${VS_YEAR}" >> "$GITHUB_ENV"

      - name: Build, test, and package
        run: task ci

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dock_wmac-windows
          path: build/Dock_WMac_*.zip
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: windows-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: dock_wmac-windows
          path: .

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            Dock_WMac_*.zip
            LICENSE
          generate_release_notes: true
