version: '3'

vars:
  BUILD_TYPE: '{{default "Release" .BUILD_TYPE}}'
  BUILD_DIR: '{{default "build" .BUILD_DIR}}'

tasks:
  configure:
    desc: Configure the MSVC/Qt build. Requires CMAKE_GENERATOR, VS_INSTALL_PATH, and QT_ROOT_DIR.
    cmds:
      - task: preflight
      - powershell -NoProfile -Command "cmake --preset default -G \"$env:CMAKE_GENERATOR\""

  preflight:
    desc: Validate the shared local/CI build contract.
    cmds:
      - >-
        powershell -NoProfile -Command "$ErrorActionPreference='Stop';
        foreach ($name in 'CMAKE_GENERATOR','VS_INSTALL_PATH','QT_ROOT_DIR') {
        if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
        throw 'Missing required environment variable: ' + $name } };
        if (-not (Test-Path -LiteralPath $env:VS_INSTALL_PATH)) {
        throw 'Invalid VS_INSTALL_PATH: ' + $env:VS_INSTALL_PATH };
        if (-not (Test-Path -LiteralPath $env:QT_ROOT_DIR)) {
        throw 'Invalid QT_ROOT_DIR: ' + $env:QT_ROOT_DIR };
        Get-Command cmake | Out-Null"

  configure-ci:
    desc: Configure the CI build. Requires CMAKE_GENERATOR, VS_INSTALL_PATH, and QT_ROOT_DIR.
    cmds:
      - task: preflight
      - powershell -NoProfile -Command "cmake --preset ci -G \"$env:CMAKE_GENERATOR\""

  build:
    desc: Build the application.
    deps: [configure]
    cmds:
      - cmake --build {{.BUILD_DIR}} --config {{.BUILD_TYPE}}

  test:
    desc: Run unit tests.
    cmds:
      - cmake --build {{.BUILD_DIR}} --config {{.BUILD_TYPE}}
      - cmd: ctest -C {{.BUILD_TYPE}} --output-on-failure
        dir: '{{.BUILD_DIR}}'

  package:
    desc: Build the CPack ZIP package.
    deps: [test]
    cmds:
      - cmd: cpack -G ZIP -C {{.BUILD_TYPE}}
        dir: '{{.BUILD_DIR}}'

  ci:
    desc: Run the same build/test/package flow used by GitHub Actions.
    cmds:
      - task: configure-ci
      - task: test
      - task: package

  local-ci:
    desc: Run the full local configure/build/test/package flow.
    cmds:
      - task: configure
      - task: test
      - task: package

  clean-build:
    desc: Remove generated build directories.
    cmds:
      - powershell -NoProfile -Command "Remove-Item -Recurse -Force build,build-debug -ErrorAction SilentlyContinue"

