version: '3'

vars:
  BUILD_TYPE: '{{default "Release" .BUILD_TYPE}}'
  BUILD_DIR: '{{default "build" .BUILD_DIR}}'

tasks:
  configure:
    desc: Configure the MSVC/Qt build. Requires CMAKE_GENERATOR, VS_INSTALL_PATH, and QT_ROOT_DIR.
    requires:
      vars: [CMAKE_GENERATOR, VS_INSTALL_PATH, QT_ROOT_DIR]
    cmds:
      - cmake --preset default -G "{{.CMAKE_GENERATOR}}"

  configure-ci:
    desc: Configure the CI build. Requires CMAKE_GENERATOR, VS_INSTALL_PATH, and QT_ROOT_DIR.
    requires:
      vars: [CMAKE_GENERATOR, VS_INSTALL_PATH, QT_ROOT_DIR]
    cmds:
      - cmake --preset ci -G "{{.CMAKE_GENERATOR}}"

  build:
    desc: Build the application.
    deps: [configure]
    cmds:
      - cmake --build {{.BUILD_DIR}} --config {{.BUILD_TYPE}}

  test:
    desc: Run unit tests.
    cmds:
      - cmake --build {{.BUILD_DIR}} --config {{.BUILD_TYPE}} --parallel
      - ctest --test-dir {{.BUILD_DIR}} -C {{.BUILD_TYPE}} --output-on-failure

  package:
    desc: Build the CPack ZIP package.
    deps: [test]
    cmds:
      - cpack --config {{.BUILD_DIR}}/CPackConfig.cmake -B {{.BUILD_DIR}} -G ZIP -C {{.BUILD_TYPE}}

  ci:
    desc: Run the same build/test/package flow used by GitHub Actions.
    cmds:
      - task: configure-ci
      - task: package

  local-ci:
    desc: Run the full local configure/build/test/package flow.
    cmds:
      - task: configure
      - task: package

  clean-build:
    desc: Remove generated build directories.
    cmds:
      - powershell -NoProfile -Command "Remove-Item -Recurse -Force build,build-debug -ErrorAction SilentlyContinue"

